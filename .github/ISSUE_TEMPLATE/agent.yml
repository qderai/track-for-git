name: An AI agent is not recognised
description: Commits or pull requests made with an agent show as a person alone.
labels: [agents]
body:
  - type: input
    id: agent
    attributes:
      label: The agent
      placeholder: e.g. Acme Coder 2
    validations:
      required: true
  - type: textarea
    id: marks
    attributes:
      label: What its commits carry
      description: The author and committer name and login, and any trailer line (Co-authored-by, Assisted-by…) from one of its commits. Remove anything private.
    validations:
      required: true
